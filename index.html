<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vicky De Palma · Eventos</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    color: #26307A;
    background:
      radial-gradient(circle at 8% 12%, rgba(242,107,58,0.35) 0%, transparent 28%),
      radial-gradient(circle at 95% 22%, rgba(233,139,181,0.40) 0%, transparent 30%),
      radial-gradient(circle at 90% 88%, rgba(255,214,79,0.35) 0%, transparent 30%),
      radial-gradient(circle at 5% 78%, rgba(38,48,122,0.25) 0%, transparent 32%),
      linear-gradient(180deg, #13BDBF 0%, #00AEB1 45%, #009CA0 100%);
    background-attachment: fixed;
  }

  .wrap { max-width: 520px; margin: 0 auto; padding: 40px 16px 48px; }

  header { text-align: center; margin-bottom: 32px; }
  .logo {
    display: block; width: min(300px, 78%); height: auto; margin: 0 auto 14px;
    filter: drop-shadow(0 4px 18px rgba(38,48,122,0.30));
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .tagline {
    display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 3px;
    text-transform: uppercase; color: #FFFFFF; background: #E8582A;
    padding: 7px 16px; border-radius: 100px;
    box-shadow: 0 6px 18px rgba(232,88,42,0.35);
  }

  .section-title {
    font-size: 12px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase;
    color: #26307A; margin: 0 4px 12px; display: flex; align-items: center; gap: 8px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: rgba(38,48,122,0.3); }

  .events { display: flex; flex-direction: column; gap: 16px; margin-bottom: 32px; }

  .event {
    position: relative; overflow: hidden;
    border-radius: 24px; padding: 22px 20px;
    color: var(--text); background: var(--bg);
    box-shadow: 0 14px 36px rgba(20,40,80,0.30);
    animation: rise .5s ease both;
  }
  .event:nth-child(2) { animation-delay: .08s; }
  .event:nth-child(3) { animation-delay: .16s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .event::before {
    content: ''; position: absolute; width: 220px; height: 220px; border-radius: 50%;
    top: -90px; right: -70px; background: var(--accent); opacity: .28; filter: blur(40px);
  }

  .event-top { position: relative; display: flex; align-items: flex-start; gap: 14px; }
  .event-emoji { font-size: 40px; line-height: 1; filter: drop-shadow(0 0 12px var(--glow)); }
  .event-kicker { font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); }
  .event-name { font-family: 'Bebas Neue', sans-serif; font-size: 36px; line-height: .95; letter-spacing: 1px; }

  .event-info { position: relative; margin: 14px 0 18px; font-size: clamp(12px, 3.6vw, 14px); font-weight: 600; letter-spacing: .5px; }
  .event-info .item { white-space: nowrap; }
  .event-info .sep { color: var(--accent); margin: 0 6px; }

  .event-btn {
    position: relative; display: block; width: 100%; text-align: center; text-decoration: none;
    padding: 14px; border-radius: 16px;
    font-weight: 800; font-size: 15px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--btn-text); background: var(--btn-bg); border: 2px solid var(--btn-border);
    transition: transform .15s, box-shadow .15s, background .15s, color .15s;
  }
  .event-btn:hover {
    transform: translateY(-2px);
    color: var(--btn-hover-text); background: var(--btn-hover-bg);
    box-shadow: 0 8px 24px var(--glow);
  }

  /* Past events: compact and muted */
  .past { display: flex; flex-direction: column; gap: 10px; }
  .past-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-radius: 16px;
    background: rgba(255,255,255,0.82); border: 1.5px solid rgba(255,255,255,0.9); box-shadow: 0 6px 18px rgba(20,40,80,0.12);
  }
  .past-item .e { font-size: 24px; filter: grayscale(.3); }
  .past-item .n { font-weight: 700; font-size: 14px; }
  .past-item .d { font-size: 12px; color: #4a5390; }
  .past-item .tag {
    margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    color: #F26B3A; background: rgba(242,107,58,0.12); padding: 4px 10px; border-radius: 100px;
  }

  .empty {
    text-align: center; padding: 28px 20px; border-radius: 24px;
    background: rgba(255,255,255,0.8); border: 1.5px dashed rgba(38,48,122,0.35);
    color: #4a5390; font-weight: 500;
  }
  .empty strong { display: block; font-size: 16px; color: #26307A; margin-bottom: 4px; }

  footer { text-align: center; margin-top: 36px; font-size: 12px; color: #26307A; }
  footer a { color: #26307A; font-weight: 700; text-decoration: none; border-bottom: 2px solid #F26B3A; }
  footer a:hover { color: #F26B3A; }
</style>
</head>

    boton: "¡Me apunto! 🌞",
    tema: "verano"
  }
];

/* Paletas de cada tema (puedes crear nuevas) */
const TEMAS = {
  otono: {
    "--bg": "linear-gradient(160deg, #FDFBF7 0%, #F3ECF9 55%, #E6F4F3 100%)",
    "--text": "#13345A", "--accent": "#9B7BC4", "--glow": "rgba(155,123,196,0.45)",
    "--btn-bg": "#13345A", "--btn-text": "#FFFFFF", "--btn-border": "#13345A",
    "--btn-hover-bg": "#9B7BC4", "--btn-hover-text": "#FFFFFF"
  },
  halloween: {
    "--bg": "linear-gradient(160deg, #221e1a 0%, #141210 100%)",
    "--text": "#EFE3CF", "--accent": "#FF7A1A", "--glow": "rgba(255,122,26,0.45)",
    "--btn-bg": "#141210", "--btn-text": "#FF7A1A", "--btn-border": "#FF7A1A",
    "--btn-hover-bg": "#FF7A1A", "--btn-hover-text": "#141210"
  },
  verano: {
    "--bg": "linear-gradient(160deg, #FF6B47 0%, #FFD93D 40%, #4ECDC4 80%, #A8E6CF 100%)",
    "--text": "#FFFFFF", "--accent": "#FFFFFF", "--glow": "rgba(255,217,61,0.6)",
    "--btn-bg": "#FFFFFF", "--btn-text": "#E05A30", "--btn-border": "#FFFFFF",
    "--btn-hover-bg": "#FFF4E8", "--btn-hover-text": "#E05A30"
  }
};

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const activos = EVENTOS.filter(e => e.activo);
const pasados = EVENTOS.filter(e => !e.activo);

const activeEl = document.getElementById('active');
if (activos.length === 0) {
  activeEl.innerHTML = `<div class="empty"><strong>Pronto habrá nuevos eventos ✨</strong>Sígueme en Instagram para enterarte.</div>`;
} else {
  activos.forEach(e => {
    const card = document.createElement('article');
    card.className = 'event';
    Object.entries(TEMAS[e.tema] || TEMAS.verano).forEach(([k, v]) => card.style.setProperty(k, v));
    card.innerHTML = `
      <div class="event-top">
        <span class="event-emoji">${esc(e.emoji)}</span>
        <div>
          <p class="event-kicker">${esc(e.tipo)}</p>
          <h3 class="event-name">${esc(e.nombre)}</h3>
        </div>
      </div>
      <p class="event-info">${[e.fecha, e.hora, e.lugar, e.precio].filter(Boolean).map(x => `<span class="item">${esc(x)}</span>`).join('<span class="sep">·</span><wbr>')}</p>
      <a class="event-btn" href="./${encodeURIComponent(e.carpeta)}/">${esc(e.boton)}</a>`;
    activeEl.appendChild(card);
  });
}

if (pasados.length === 0) {
  document.getElementById('past-section').style.display = 'none';
} else {
  const pastEl = document.getElementById('past');
  pasados.forEach(e => {
    const row = document.createElement('div');
    row.className = 'past-item';
    row.innerHTML = `
      <span class="e">${esc(e.emoji)}</span>
      <div><div class="n">${esc(e.nombre)}</div><div class="d">${esc(e.fecha)} · ${esc(e.lugar)}</div></div>
      <span class="tag">Finalizado</span>`;
    pastEl.appendChild(row);
  });
}
</script>
